global:
  scrape_interval: 5s
  scrape_timeout: 4s
  evaluation_interval: 5s

rule_files:
  - "/etc/prometheus/alerts.yml"

scrape_configs:
  - job_name: "gatewayd"
    metrics_path: "/metrics"
    scheme: "http"
    static_configs:
      - targets: ["gatewayd:8080"]
        labels:
          env: "production"
          service: "gatewayd"

  - job_name: "prometheus"
    metrics_path: "/metrics"
    scheme: "http"
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          env: "production"
          service: "prometheus"