name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.4"
          # Отключаем кэш, чтобы избежать ошибки tar: Cannot open: File exists
          cache: false

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v7
        with:
          # Используем фиксированную версию, чтобы избежать проблем с "latest"
          version: v2.13.0

      - name: Test (with race detector)
        run: |
          # Запускаем тесты с -race и -p 1 (последовательно, чтобы Testcontainers не перегружали раннер)
          go test -race -p 1 ./... -count=1

      - name: Run govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-package: ./...